packages:
  - "apps/*"
  - "packages/*"

overrides:
  "esbuild@<0.28.1": "0.28.1"
  "fast-uri@<3.1.5": "3.1.5"
  "js-yaml@>=3.0.0 <4.0.0": "3.15.1"
  "js-yaml@>=4.0.0 <5.0.0": "4.3.1"
  "js-yaml@>=5.0.0 <6.0.0": "5.2.3"
  "nanoid@<3.3.18": "3.3.18"

allowBuilds:
  "@scarf/scarf": false
  "@nestjs/core": true
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  "@tailwindcss/oxide": true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@parcel/watcher"
  - "@prisma/client"
  - "@tailwindcss/oxide"
  - "esbuild"
  - "prisma"
  - "sharp"
  - "vue-demi"
