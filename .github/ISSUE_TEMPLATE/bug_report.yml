name: Bug report
description: Report a reproducible problem without private data
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove credentials, user conversations, production URLs, and personal information.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - API / LangGraph
        - Worker / queues
        - Public Web
        - Admin
        - Flutter SDK
        - Database / infrastructure
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Node/Flutter version, browser/device, deployment mode
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed secrets, production endpoints, personal information, and real conversations.
          required: true
        - label: This is not a security vulnerability. Security issues are reported privately.
          required: true
